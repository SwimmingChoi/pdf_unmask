name: Build Windows EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: python -m PyInstaller --onefile --clean --noconfirm --name PDF마스킹제거 pdf_unmask.py

      - name: Smoke test packaged EXE
        shell: python
        run: |
          import subprocess
          import tempfile
          from pathlib import Path
          from pypdf import PdfWriter

          with tempfile.TemporaryDirectory() as folder:
              source = Path(folder) / 'sample.pdf'
              writer = PdfWriter()
              writer.add_blank_page(width=100, height=100)
              writer.write(source)
              subprocess.run(
                  [str(Path('dist/PDF마스킹제거.exe').resolve()), str(source)],
                  input='\n', text=True, check=True, timeout=60,
              )
              result = source.with_name('sample_마스킹제거.pdf')
              assert result.is_file(), 'Packaged EXE did not produce a PDF'

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: PDF-unmask-Windows-x64
          path: dist/PDF마스킹제거.exe
          if-no-files-found: error
          retention-days: 30
